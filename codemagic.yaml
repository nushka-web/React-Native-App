workflows:
  arthum-ios-simulator:
    name: Arthum AI - iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_WORKSPACE: "AuthFlow.xcworkspace"
        XCODE_SCHEME: "AuthFlow"

    scripts:
      - name: Install Node dependencies
        script: |
          npm install

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Build iOS Simulator app
        script: |
          export NODE_BINARY=$(command -v node)

          xcodebuild \
            -workspace "ios/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Simulator app
        script: |
          APP_PATH=$(find "$CM_BUILD_DIR/build/ios/Build/Products/Debug-iphonesimulator" \
            -maxdepth 1 -name "*.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "Simulator app not found"
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/artifacts"
          cd "$(dirname "$APP_PATH")"
          zip -r "$CM_BUILD_DIR/artifacts/ArthumAI-Simulator.zip" "$(basename "$APP_PATH")"

    artifacts:
      - artifacts/ArthumAI-Simulator.zip