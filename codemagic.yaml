
workflows:
  arthum-ios-simulator:
    name: Arthum AI - iOS Simulator
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        XCODE_WORKSPACE: "AuthFlow.xcworkspace"
        XCODE_SCHEME: "AuthFlow"
      node: 22
      xcode: latest

    scripts:
      - name: Install Node dependencies
        script: |
          export NODE_ENV=development
          export npm_config_production=false
          npm ci --include=dev

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Build iOS Simulator app
        script: |
          export NODE_BINARY=$(command -v node)

          xcodebuild \
            -workspace "ios/$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify JavaScript bundle
        script: |
          APP_PATH="$CM_BUILD_DIR/build/ios/Build/Products/Release-iphonesimulator/AuthFlow.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "Simulator app not found"
            exit 1
          fi

          if [ ! -f "$APP_PATH/main.jsbundle" ]; then
            echo "ERROR: main.jsbundle is missing"
            find "$APP_PATH" -name "*.jsbundle"
            exit 1
          fi

          echo "SUCCESS: main.jsbundle found"

      - name: Package Simulator app
        script: |
          APP_PATH="$CM_BUILD_DIR/build/ios/Build/Products/Release-iphonesimulator/AuthFlow.app"

          mkdir -p "$CM_BUILD_DIR/artifacts"
          cd "$(dirname "$APP_PATH")"
          zip -r "$CM_BUILD_DIR/artifacts/ArthumAI-Simulator.zip" AuthFlow.app

    artifacts:
      - artifacts/ArthumAI-Simulator.zip
